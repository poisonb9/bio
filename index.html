<!DOCTYPE html>
<html lang="pt-BR">

<style>
  :root {
    
    --respiro: 18px;
    --tinta:       #141218;
    --tinta-fraca: #5B5563;
    --fundo:       #F7F6F8;
    --superficie:  #FFFFFF;
    --linha:       #E4E1E8;
    --acento:      #1B5BFF;
    --acento-leve: #E8EFFF;
    --sombra:      #141218;
    --aviso:       #8A6A00;
    --aviso-fundo: #FFF6DA;
    --raio: 14px;
  }
  @media (prefers-color-scheme: dark) and (prefers-color-scheme: light)  {
    :root:not([data-theme="light"]) {
      --tinta:       #F2EFF4;
      --tinta-fraca: #A7A0B2;
      --fundo:       #121016;
      --superficie:  #1D1A22;
      --linha:       #322D3B;
      --acento-leve: #241F33;
      --aviso:       #FFD98A;
      --aviso-fundo: #2A2212;
    }
  }
  :root[data-theme="dark"] {
    --tinta:       #F2EFF4;
    --tinta-fraca: #A7A0B2;
    --fundo:       #121016;
    --superficie:  #1D1A22;
    --linha:       #322D3B;
    --acento-leve: #241F33;
    --aviso:       #FFD98A;
    --aviso-fundo: #2A2212;
  }

  * { box-sizing: border-box; }

  
  html { overflow-x: clip; }
  body {
    overflow-x: clip;
    margin: 0;
    background: var(--fundo);
    color: var(--tinta);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .envelope { max-width: 440px; margin: 0 auto; padding: var(--respiro) var(--respiro) 56px; }

  
  .previa {
    border: 1px dashed var(--linha);
    border-radius: var(--raio);
    padding: 12px;
    margin-bottom: 28px;
  }
  .previa h2 {
    margin: 0 0 3px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--tinta-fraca);
  }
  .previa p { margin: 0 0 10px; font-size: 11.5px; line-height: 1.45; color: var(--tinta-fraca); }
  .abas { display: flex; flex-wrap: wrap; gap: 6px; }
  .aba {
    font: 500 11.5px/1 "Poppins", sans-serif;
    padding: 7px 10px; border-radius: 999px;
    border: 1px solid var(--linha);
    background: var(--superficie); color: var(--tinta-fraca);
    cursor: pointer;
  }
  .aba[aria-pressed="true"] {
    border-color: var(--acento); background: var(--acento-leve);
    color: var(--acento); font-weight: 600;
  }
  .aba:focus-visible,
  .botao:focus-visible,
  .produto:focus-visible,
  .interruptor:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  
  .topo { display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; }
  
  .balao-canal {
    position: absolute; top: 26px; left: calc(50% + 62px); width: 58px;
    pointer-events: none; transform-origin: 50% 100%;
  }
  .balao-canal img { width: 100%; height: auto; display: block;
    filter: drop-shadow(0 6px 10px rgba(20, 16, 30, .14)); }
  .balao-canal img:not([src]) { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .balao-canal { animation: flutuar 6.4s ease-in-out -2s infinite alternate; }
  }
  @keyframes flutuar {
    from { transform: translate3d(0, -5px, 0) rotate(-3deg); }
    to   { transform: translate3d(0, 5px, 0) rotate(3deg); }
  }
  
  .topo { padding-top: 30px; }
  .varal-bio { position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1px; pointer-events: none;
    --lh: 21px; --sag: 10px; z-index: 1; }
  .varal-bio span { display: block;
    transform: translateY(calc(var(--arco) * var(--sag) + var(--dy) * var(--lh))); }
  .varal-bio img { height: var(--lh); width: auto; display: block; }
  .festa-bio { position: absolute; pointer-events: none; transform-origin: 50% 100%; }
  .festa-bio img { width: 100%; height: auto; display: block; }
  .festa-bio.presente { width: 34px; top: 66px; left: calc(50% - 150px); }
  .festa-bio.laco    { width: 32px; top: 40px; left: calc(50% - 116px); }
  .festa-bio.cupom   { width: 30px; top: 74px; left: calc(50% + 116px); }
  @media (prefers-reduced-motion: no-preference) {
    .varal-bio img { animation: vbSobe var(--d1) ease-in-out var(--a1) infinite alternate,
                               vbGira var(--d2) ease-in-out var(--a2) infinite alternate; }
    .festa-bio.presente { animation: flutuar 6.1s ease-in-out -1.4s infinite alternate; }
    .festa-bio.laco    { animation: flutuar 7.3s ease-in-out -3.9s infinite alternate; }
    .festa-bio.cupom   { animation: flutuar 6.7s ease-in-out -2.2s infinite alternate; }
  }
  @keyframes vbSobe { from { translate: 0 calc(var(--amp) * -1); } to { translate: 0 var(--amp); } }
  @keyframes vbGira { from { rotate: calc(var(--rot) * -1); } to { rotate: var(--rot); } }
  .varal-bio span:nth-child(1) img { --d1:3.99s; --d2:5.39s; --a1:-1.25s; --a2:-0.71s; --amp:1.2px; --rot:2.5deg; }
  .varal-bio span:nth-child(2) img { --d1:5.09s; --d2:5.99s; --a1:-3.2s; --a2:-4.92s; --amp:1.9px; --rot:2.3deg; }
  .varal-bio span:nth-child(3) img { --d1:3.18s; --d2:4.77s; --a1:-2.37s; --a2:-1.6s; --amp:1.9px; --rot:1.7deg; }
  .varal-bio span:nth-child(4) img { --d1:3.66s; --d2:4.83s; --a1:-1.17s; --a2:-0.1s; --amp:1.6px; --rot:1.8deg; }
  .varal-bio span:nth-child(5) img { --d1:3.59s; --d2:7.07s; --a1:-2.08s; --a2:-2.19s; --amp:1.2px; --rot:2.8deg; }
  .varal-bio span:nth-child(6) img { --d1:4.6s; --d2:5.98s; --a1:-1.06s; --a2:-4.4s; --amp:1.7px; --rot:1.8deg; }
  .varal-bio span:nth-child(7) img { --d1:3.44s; --d2:6.34s; --a1:-0.97s; --a2:-6.32s; --amp:1.2px; --rot:2.6deg; }
  .varal-bio span:nth-child(8) img { --d1:3.67s; --d2:5.87s; --a1:-0.73s; --a2:-2.85s; --amp:1.2px; --rot:1.6deg; }
  .varal-bio span:nth-child(9) img { --d1:4.83s; --d2:7.18s; --a1:-2.23s; --a2:-1.59s; --amp:1.7px; --rot:2.4deg; }
  .varal-bio span:nth-child(10) img { --d1:4.84s; --d2:4.57s; --a1:-0.91s; --a2:-0.47s; --amp:1.2px; --rot:1.9deg; }
  .varal-bio span:nth-child(11) img { --d1:4.83s; --d2:5.57s; --a1:-2.27s; --a2:-2.91s; --amp:1.8px; --rot:1.6deg; }
  
  .heroi { text-align: center; padding: 4px 0 2px; }
  .marca {
    font: 700 12px/1 var(--fonte-mono, monospace);
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--fraco); margin: 10px 0 4px;
  }
  
  .promessa-canal {
    font-size: 14px; line-height: 1.4; color: var(--fraco);
    max-width: 30ch; margin: 2px auto 6px;
  }
  .chamada {
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: clamp(27px, 8.4vw, 38px); line-height: 1.04;
    letter-spacing: -.02em; margin: 6px 0 12px;
  }
  .chamada em { font-style: normal; color: var(--acento); }
  
  
  .vivo {
    height: 98px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    margin: 0 auto 14px; max-width: 30ch;
  }
  .vivo { text-decoration: none; color: inherit; }
  
  .vivo[href] { padding: 6px 10px; border-radius: 12px; }
  .vivo[href]:active { background: var(--tinta-mais-fraca, rgba(0,0,0,.05)); }
  .vivo .oque {
    font-size: 14.5px; line-height: 1.25; color: var(--tinta);
    
    height: 36px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .vivo .dica {
    font-size: 11.5px; color: var(--fraco); letter-spacing: .04em;
  }
  .vivo .cursor {
    display: inline-block; width: 2px; height: 1em; margin-left: 1px;
    background: var(--acento); vertical-align: -2px;
    animation: piscar 1.05s step-end infinite;
  }
  @keyframes piscar { 50% { opacity: 0; } }
  
  
  .vivo .quanto.entrando {
    animation: impulso .52s cubic-bezier(.2,1.5,.3,1) both;
  }
  @keyframes impulso {
    0%   { transform: scale(.72); opacity: 0; }
    58%  { transform: scale(1.1);  opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  .vivo .caiu-aqui { animation: chegar .5s .18s backwards; }
  @keyframes chegar {
    0%   { transform: scale(.4) rotate(-14deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .vivo .quanto.entrando, .vivo .caiu-aqui { animation: none; }
  }

  
  .novo {
    position: absolute; top: 7px; right: 7px; z-index: 1;
    background: #16a34a; color: #fff;
    font: 700 10.5px/1 var(--fonte-mono, monospace);
    padding: 5px 8px; border-radius: 999px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  .achado-hoje { color: #16a34a; }

  .vivo .antes {
    font-size: 12px; color: var(--fraco); margin-left: 8px;
    font-weight: 400; text-decoration-thickness: 1px;
  }
  .vivo .caiu-aqui {
    display: inline-block; margin-left: 8px; vertical-align: 2px;
    background: var(--acento); color: #fff;
    font: 700 11px/1 var(--fonte-mono, monospace);
    padding: 4px 6px; border-radius: 999px;
  }
  .vivo .quanto {
    height: 24px;
    font: 700 21px/1 var(--fonte-mono, monospace); color: var(--acento);
  }
  .rolar {
    display: inline-flex; align-items: center; gap: 8px;
    border: 0; cursor: pointer; font: 600 14.5px/1 inherit;
    background: var(--tinta); color: var(--fundo);
    padding: 13px 20px; border-radius: 999px; margin-bottom: 4px;
  }
  .rolar .seta { animation: descer 1.6s ease-in-out infinite; }
  @keyframes descer { 0%,100% { transform: translateY(0); }
                      50% { transform: translateY(3px); } }
  .prova {
    font-size: 12px; color: var(--fraco); margin: 10px 0 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .vivo .cursor, .rolar .seta { animation: none; }
  }
  
  .prova_forte {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin: 20px 0 4px; text-align: center;
  }
  .prova_forte div { padding: 2px 4px; }
  .prova_forte .numero {
    display: block; font: 700 19px/1.1 var(--fonte-mono, monospace);
    color: var(--acento);
  }
  .prova_forte .oque {
    display: block; font-size: 11.5px; line-height: 1.3;
    color: var(--fraco); margin-top: 4px;
  }

  
  .esteira {
    
    margin: 14px calc(var(--respiro) * -1) 2px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent,
      #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(90deg, transparent,
      #000 8%, #000 92%, transparent);
  }
  .esteira .trilho {
    display: flex; gap: 9px; width: max-content;
    animation: correr 42s linear infinite;
  }
  .esteira:active .trilho, .esteira:hover .trilho {
    animation-play-state: paused;
  }
  @keyframes correr { to { transform: translateX(-50%); } }
  .esteira a {
    display: block; width: 88px; flex: 0 0 88px;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--linha, rgba(0,0,0,.08));
    background: var(--caixa, #fff); text-decoration: none;
  }
  .esteira img { width: 88px; height: 88px; object-fit: cover; display: block; }
  .esteira .etiq {
    display: block; font: 700 11px/1 var(--fonte-mono, monospace);
    color: var(--acento); padding: 6px 5px 7px; text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .esteira .trilho { animation: none; }
    .esteira { overflow-x: auto; }
  }
  .avatar {
    width: 104px; height: 104px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--acento); color: #fff;
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: 33px; letter-spacing: -.02em;
    overflow: hidden;
  }
  
  .avatar.com-brasao { background: transparent; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    margin: 3px 0 0;
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: clamp(24px, 7vw, 30px); line-height: 1.1;
    letter-spacing: -.01em; text-wrap: balance;
  }
  .arroba {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; color: var(--tinta-fraca);
  }
  .promessa { margin: 4px 0 0; max-width: 32ch; font-size: 14.5px; color: var(--tinta-fraca); text-wrap: balance; }

  
  .vantagens { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .vantagens li {
    display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start;
    font-size: 14px; font-weight: 500;
  }
  .marca { font-size: 16px; line-height: 1.35; }

  
  .grupo { margin-top: 30px; display: flex; flex-direction: column; gap: 11px; }
  .guia { margin: 0; text-align: center; font-size: 13.5px; font-weight: 600; color: var(--tinta-fraca); text-wrap: balance; }

  .botao {
    display: grid; grid-template-columns: 44px 1fr 22px; gap: 10px; align-items: center;
    padding: 12px;
    background: var(--superficie); color: var(--tinta);
    border: 1.5px solid var(--tinta); border-radius: var(--raio);
    box-shadow: 4px 4px 0 var(--sombra);
    text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.botao:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--sombra); }
  a.botao:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--sombra); }
  .botao.desligado { opacity: .55; }
  .selo {
    width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center; font-size: 21px;
    background: var(--acento-leve);
    overflow: hidden;
  }
  
  .selo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rotulo { text-align: center; font-size: 14px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
  .seta { text-align: center; font-size: 16px; color: var(--tinta-fraca); }

  
  .produtos { margin-top: 34px; }
  .cabeca { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .cabeca h2 { margin: 0; font-family: "Archivo Black", system-ui, sans-serif; font-size: 15px; }
  .etiqueta {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--tinta-fraca); text-align: right;
  }
  .vitrine { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  
  .vitrine.solo { grid-template-columns: 1fr; }
  .vitrine.solo .produto { flex-direction: row; }
  .vitrine.solo .foto {
    aspect-ratio: 2 / 3; width: 108px; flex: none;
    border-bottom: none; border-right: 1.5px solid var(--tinta);
  }
  .vitrine.solo .corpo { padding: 12px 13px; gap: 7px; }
  .vitrine.solo .nome { font-size: 14.5px; }
  .vitrine.solo .preco { font-size: 22px; }
  .produto {
    display: flex; flex-direction: column;
    background: var(--superficie); color: var(--tinta);
    border: 1.5px solid var(--tinta); border-radius: var(--raio);
    box-shadow: 4px 4px 0 var(--sombra);
    overflow: hidden; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.produto:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--sombra); }
  .foto {
    aspect-ratio: 1 / 1; display: grid; place-items: center;
    font-size: 40px; background: var(--acento-leve);
    border-bottom: 1.5px solid var(--tinta);
    overflow: hidden;
  }
  
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .corpo { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
  
  .nome { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .preco { font-family: "Archivo Black", system-ui, sans-serif; font-size: 17px; color: var(--acento); letter-spacing: -.01em; }
  .preco .antes {
    font-family: var(--fonte-mono, monospace); font-size: 11.5px;
    color: var(--fraco); margin-left: 7px; font-weight: 400;
    text-decoration-thickness: 1px;
  }
  
  
  
  .produto { --fraco: var(--tinta-fraca); --verde: #16a34a; }
  .produto .loja-boa { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--tinta-fraca); }
  .produto .avise-me {
    display: block; margin-top: 8px; padding: 7px 10px; text-align: center;
    font-size: 12.5px; font-weight: 700; color: var(--tinta);
    border: 1.5px solid var(--tinta); border-radius: 999px; cursor: pointer;
    background: transparent;
  }
  .produto .avise-me:active { transform: translateY(1px); }
  .serie-wrap { position: relative; margin-top: 8px; padding-right: 4px; }
  .serie-wrap .escala {
    display: flex; justify-content: flex-start; flex-wrap: nowrap; gap: 6px;
    margin-top: 6px; align-items: center;
    font: 400 0.6875rem/1.3 Poppins, sans-serif; color: var(--fraco);
    font-variant-numeric: tabular-nums;
  }
  .serie-wrap .escala svg { width: 13px; height: 13px; flex: 0 0 auto; opacity: .9; }
  .serie-wrap .escala .nq { white-space: normal; text-wrap: balance; }
  .serie-wrap .escala .nq.ok { color: var(--verde); font-weight: 600; }
  .serie-wrap .agora {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: var(--fraco); transform: translate(-50%, -50%); margin-left: -2px;
  }
  .serie-wrap.baixou .agora { background: var(--verde); }
  .serie { display: block; width: 100%; height: 34px; }
  .serie .area { fill: var(--fraco); opacity: .10; stroke: none; }
  .serie.baixou .area { fill: var(--verde); opacity: .13; }
  .serie .linha {
    fill: none; stroke: var(--fraco); stroke-width: 2;
    stroke-linejoin: round; stroke-linecap: round; opacity: .75;
  }
  .serie.baixou .linha { stroke: var(--verde); opacity: 1; }
  .foto { position: relative; }
  
  .areas {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px 6px; padding: 10px 16px;
    background: color-mix(in srgb, var(--fundo, #f6f6f8) 88%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .areas::-webkit-scrollbar { display: none; }
  .area {
    flex: none; font-family: inherit; font-weight: 600; font-size: 13px;
    line-height: 1; padding: 9px 15px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--tinta); background: var(--superficie);
    color: var(--tinta);
  }
  .area:active { background: var(--tinta); color: var(--superficie); }
  .setor { scroll-margin-top: 64px; margin-top: 26px; }
  .setor .cabeca { display: block; margin-bottom: 12px; }
  .setor .apoio {
    margin: 4px 0 0; font-size: 13.5px; color: var(--tinta-fraca);
  }
  .vitrine.trilho-setor {
    display: grid; grid-auto-flow: column; grid-template-columns: none;
    grid-auto-columns: 46%; gap: 12px; overflow-x: auto;
    scroll-snap-type: x mandatory; scrollbar-width: none;
    margin: 0 -16px; padding: 2px 16px 10px; scroll-padding: 0 16px;
  }
  .vitrine.trilho-setor::-webkit-scrollbar { display: none; }
  .vitrine.trilho-setor .produto { scroll-snap-align: start; }

      foto.appendChild(el("span", "caiu", "caiu " + Math.round(p.queda) + "%"));
    }
    if (p.imagem) {
      var img = document.createElement("img");
      img.src = p.imagem;
      img.alt = p.nome;
      img.loading = "lazy";
      img.addEventListener("error", function () {
        img.remove();
        foto.textContent = p.emoji;
      });
      foto.appendChild(img);
    } else {
      foto.textContent = p.emoji;
    }
    e.appendChild(foto);
    var corpo = el("div", "corpo");
    corpo.appendChild(el("div", "nome", p.nome));
    var linha_preco = el("div", "preco");
    linha_preco.appendChild(el("span", null, p.preco));
    if (p.antes) {
      linha_preco.appendChild(el("s", "antes", p.antes));
    }
    corpo.appendChild(linha_preco);
    var gr = grafico(p);
    if (gr) {
      var escL = gr.querySelector(".escala");
      if (escL) {
        escL.classList.add("meta-linha");
        var lupa = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        lupa.setAttribute("viewBox", "0 0 16 16");
        lupa.setAttribute("aria-hidden", "true");
        lupa.innerHTML = '<circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/>'
          + '<path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
        escL.insertBefore(lupa, escL.firstChild);
      }
      corpo.appendChild(gr);
    }
    if (gr) {
    } else if (!eNovo) {
      var ac = el("div", "acompanha");
      ac.appendChild(el("span", "pulso"));
      var quanto = p.dias <= 0
        ? "de olho desde hoje"
        : (p.dias === 1 ? "de olho há 1 dia"
                        : "de olho há " + p.dias + " dias");
      ac.appendChild(el("span", null, quanto));
      corpo.appendChild(ac);
    } else {
      var novoRod = el("div", "acompanha achado-hoje");
      novoRod.appendChild(el("span", "pulso"));
      novoRod.appendChild(el("span", null, "achado agora"));
      corpo.appendChild(novoRod);
    }
    if (p.nota_loja >= 4.5 && p.vendas_loja >= 1000) {
      var mil = p.vendas_loja >= 1000
        ? (Math.round(p.vendas_loja / 100) / 10).toString().replace(".", ",").replace(/,0$/, "") + " mil"
        : String(p.vendas_loja);
      corpo.appendChild(el("div", "loja-boa",
        "✓ loja nota " + String(p.nota_loja).replace(".", ",") + " · " + mil + " vendidos"));
    }
    if (!falta && p.id && /^\d+$/.test(String(p.id))) {
      var av = el("span", "avise-me", "🔔 avise-me no Telegram se baixar");
      av.setAttribute("role", "link");
      av.tabIndex = 0;
      var abrirBot = function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        medir("clique", { canal: CANAIS[atual].banco, tipo: "alerta", rotulo: p.nome });
        location.href = "https://t.me/" + BOT_ALERTA + "?start=alerta_" + encodeURIComponent(String(p.id));
      };
      av.addEventListener("click", abrirBot);
      av.addEventListener("keydown", function (ev) { if (ev.key === "Enter") abrirBot(ev); });
      corpo.appendChild(av);
    }
    e.appendChild(corpo);
    return e;
  }

  var BOT_ALERTA = "AchadinhoTotalBot";

  var BALOES_CANAL = {
    "achadinho.make": "canal_achadinho_make",
    "modofuturo": "canal_modo_futuro",
    "semanestesia.pod": "canal_sem_anestesia",
    "fatura.chora": "canal_pago_menos",
    "achadinhos.instantaneos": "canal_achadinhos_instantaneos",
    "cozinha.internacional": "canal_achadinho_chef"
  };
  function desenhar(chave) {
    var c = CANAIS[chave];
    document.title = c.nome + " · Achadinho Total";
    raiz.style.setProperty("--acento", c.acento);

    var av = document.getElementById("avatar");
    av.innerHTML = "";
    var marcaDaCasa = BRASOES[chave];
    if (marcaDaCasa) {
      var brasao = document.createElement("img");
      brasao.src = marcaDaCasa;
      brasao.alt = c.nome;
      av.appendChild(brasao);
      av.classList.add("com-brasao");
    } else {
      av.textContent = c.inicial;
      av.classList.remove("com-brasao");
    }
    var bc = document.getElementById("balao_canal");
    if (bc) { bc.src = "/baloes/" + (BALOES_CANAL[chave] || "inaug_lupa") + "_p.webp"; }
    document.getElementById("marca").textContent = c.nome;
    document.getElementById("promessa_canal").textContent = c.promessa || "";
    document.getElementById("chamada").innerHTML =
      "Eu procuro.<br>Você <em>paga menos</em>.";

    var nicho = (PRODUTOS_REAIS["_nicho"] || {})[atual] || [];
    var usaNicho = nicho.length >= 4;
    var todos = usaNicho ? nicho : (PRODUTOS_REAIS["_todos"] || []);
    var caixa = document.getElementById("prova_forte");
    caixa.innerHTML = "";
    if (todos.length) {
      function real(v) {
        return "R$ " + v.toFixed(2).replace(".", ",");
      }
      var precos = todos.map(function (p) { return preco_num(p.preco); })
        .filter(function (v) { return v > 0; });
      var vendas = todos.reduce(function (a, p) { return a + (p.vendas || 0); }, 0);
      var caiu = todos.filter(function (p) { return (p.queda || 0) >= 5; }).length;

      var provas = [];
      provas.push([String(todos.length), usaNicho ? (c.nicho || [""])[0]
                                                  : "achadinhos garimpados hoje"]);
      if (precos.length) {
        provas.push([real(Math.min.apply(null, precos)), "o mais barato de hoje"]);
      }
      if (caiu >= Math.ceil(todos.length / 2)) {
        provas.push([caiu + " de " + todos.length, "baixaram de preço"]);
      } else if (vendas > 0) {
        provas.push([vendas.toLocaleString("pt-BR"), "vendas destes na loja"]);
      }
      provas.forEach(function (par) {
        var d = el("div", null, null);
        d.appendChild(el("strong", "numero", par[0]));
        d.appendChild(el("span", "oque", par[1]));
        caixa.appendChild(d);
      });
    }

    var trilho = document.getElementById("trilho");
    trilho.innerHTML = "";
    var comFoto = todos.filter(function (p) { return p.imagem && p.link; });
    document.getElementById("esteira").hidden = comFoto.length < 4;
    comFoto.concat(comFoto).forEach(function (p) {
      var a = document.createElement("a");
      a.href = p.link;
      a.rel = "noopener";
      var img = document.createElement("img");
      img.src = p.imagem;
      img.alt = p.nome || "";
      img.loading = "lazy";
      a.appendChild(img);
      a.appendChild(el("span", "etiq", p.preco));
      a.addEventListener("click", function () {
        medir("clique", { canal: CANAIS[atual].banco, tipo: "produto",
                          rotulo: p.nome });
      });
      trilho.appendChild(a);
    });

    var grupos = document.getElementById("grupos");
    grupos.innerHTML = "";

    var ordenados = c.grupos.slice().sort(function (a, b) {
      var ta = JSON.stringify(a.botoes).indexOf(VITRINE) >= 0 ? 0 : 1;
      var tb = JSON.stringify(b.botoes).indexOf(VITRINE) >= 0 ? 0 : 1;
      return ta - tb;
    });

    ordenados.forEach(function (g) {
      var bs = g.botoes.filter(function (b) {
        return b[2] !== FALTA && !/tiktok\.com\/@/.test(String(b[2]));
      });
      if (!bs.length) { return; }
      var sec = el("section", "grupo");
      sec.appendChild(el("p", "guia", g.guia));
      bs.forEach(function (b) {
        sec.appendChild(montarBotao(b[0], b[1], b[2]));
      });
      grupos.appendChild(sec);
    });

    var baratos = todos.filter(function (p) {
      return p.link && p.preco;
    }).slice().sort(function (a, b) {
      return preco_num(a.preco) - preco_num(b.preco);
    });
    if (baratos.length) {
      var p0 = baratos[0];
      var sec = el("section", "grupo");
      sec.appendChild(el("p", "guia", "O mais barato que achei hoje"));
      sec.appendChild(montarBotao("queda", p0.nome + " — " + p0.preco,
                                  p0.link));
      grupos.insertBefore(sec, grupos.children[1] || null);
    }

    if (c.isca && SUPABASE.url && SUPABASE.anon) {
      var isc = c.isca, sx = el("section", "grupo isca");
      var topo = el("div", "isca-topo");
      if (isc.balao) {
        var bl = document.createElement("img");
        bl.src = isc.balao; bl.alt = ""; bl.className = "isca-balao";
        bl.setAttribute("aria-hidden", "true"); bl.loading = "lazy";
        bl.onerror = function () { bl.remove(); };
        topo.appendChild(bl);
      }
      topo.appendChild(el("p", "guia", isc.guia));
      sx.appendChild(topo);
      sx.appendChild(el("p", "isca-texto", isc.texto));
      var fm = document.createElement("form");
      fm.className = "isca-form";
      fm.innerHTML =
        '<label class="sr" for="isca-e">seu e-mail</label>' +
        '<input id="isca-e" type="email" required autocomplete="email" placeholder="seu@email.com">' +
        '<input class="isca-mel" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<label class="isca-ok"><input type="checkbox" required><span></span></label>' +
        '<button type="submit"></button><p class="isca-msg" role="status"></p>';
      fm.querySelector(".isca-ok span").textContent = isc.ok;
      fm.querySelector("button").textContent = isc.botao;
      fm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var em = fm.querySelector("#isca-e"), ck = fm.querySelector("input[type=checkbox]");
        var msg = fm.querySelector(".isca-msg"), bt = fm.querySelector("button");
        var v = em.value.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || v.length < 6) { msg.textContent = "Confira o e-mail."; em.focus(); return; }
        if (!ck.checked) { msg.textContent = "Marque a caixa para eu poder te mandar."; return; }
        if (fm.querySelector(".isca-mel").value) { return; }
        bt.disabled = true; msg.textContent = "Enviando…";
        fetch(SUPABASE.url + "/rest/v1/contato", {
          method: "POST",
          headers: { "apikey": SUPABASE.anon, "Authorization": "Bearer " + SUPABASE.anon,
                     "Content-Type": "application/json", "Prefer": "return=minimal" },
          body: JSON.stringify({ email: v, origem: "bio." + (c.banco || atual), produto: isc.produto })
        }).then(function (r) {
          if (!r.ok) { throw new Error(r.status); }
          sx.removeChild(fm);
          sx.appendChild(el("p", "isca-texto", isc.feito + v + "."));
        }).catch(function () { bt.disabled = false; msg.textContent = "Não deu agora. Tente de novo."; });
      });
      sx.appendChild(fm);
      grupos.insertBefore(sx, grupos.children[0] || null);
    }

    if (c.nome === "Achadinho Chef" && RECEITAS.length) {
      var sr = el("section", "grupo");
      sr.appendChild(el("p", "guia", "Últimas receitas do canal 🍳"));
      var lista = el("div", "receitas");
      RECEITAS.slice(0, 3).forEach(function (r) {
        var a = document.createElement("a");
        a.className = "receita"; a.href = r.url;
        if (r.capa) {
          var im = document.createElement("img");
          im.src = r.capa; im.alt = ""; im.loading = "lazy";
          im.onerror = function () { im.className = "semfoto"; im.removeAttribute("src"); };
          a.appendChild(im);
        } else { a.appendChild(el("span", "semfoto", "")); }
        var tx = el("span", "", "");
        tx.appendChild(el("b", "", r.titulo));
        var meta = ["Ficha Nº " + ("00" + r.numero).slice(-3)];
        if (r.rende) { meta.push(r.rende + " porções"); }
        if (r.tempo) { meta.push(r.tempo); }
        tx.appendChild(el("small", "", meta.join(" · ")));
        a.appendChild(tx);
        lista.appendChild(a);
      });
      sr.appendChild(lista);
      grupos.insertBefore(sr, grupos.children[0] || null);
    }

    var vitrine = document.getElementById("vitrine");
    var etiqueta = document.getElementById("etiqueta");
    vitrine.innerHTML = "";

    var lista_do_canal = [];
    var reais = PRODUTOS_REAIS[atual] || [];
    var dv = (PRODUTOS_REAIS["_do_video"] || {})[atual];
    if (dv && dv.produtos && dv.produtos.length) {
      var ids = dv.produtos.map(function (p) { return p.link; });
      reais = dv.produtos.concat(reais.filter(function (p) { return ids.indexOf(p.link) < 0; }));
    }
    var disponiveis = reais.length ? reais
      : (usaNicho ? nicho.slice(0, 4) : c.produtos);
    var real = reais.length > 0 || c.produtoReal || usaNicho;
    if (mostrandoProdutos && disponiveis.length > 0) {
      var lista = disponiveis.slice(0, 4);
      lista_do_canal = reais.length ? lista : [];
      vitrine.className = lista.length === 1 ? "vitrine solo" : "vitrine";
      etiqueta.textContent = real ? (dv && dv.rotulo ? dv.rotulo : (dv && dv.tema ? "✨ da make do vídeo: " + dv.tema : "")) : "exemplo — ainda não é real";
      lista.forEach(function (p) { vitrine.appendChild(montarProduto(p)); });
    } else {
      vitrine.className = "";
      etiqueta.textContent = "estado de hoje";
      var v = el("div", "vazio");
      v.appendChild(el("strong", null, "Ainda não tem produto aqui."));
      v.appendChild(document.createTextNode(
        "Os dois últimos que aparecerem nos vídeos entram sozinhos neste espaço."));
      vitrine.appendChild(v);
    }

    var chave_int = document.getElementById("interruptor");
    chave_int.hidden = reais.length > 0 ||
      !/^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
    chave_int.textContent = mostrandoProdutos
      ? "ver como fica sem produto (é o estado de hoje)"
      : "ver com os dois produtos preenchidos";

    document.getElementById("titulo_vitrine").textContent =
      (!reais.length && usaNicho) ? (c.nicho || ["", ""])[1]
                                  : "O que apareceu no " + c.nome;

    var outros = document.getElementById("outros");
    outros.innerHTML = "";
    var jaVistos = {};
    lista_do_canal.forEach(function (p) { jaVistos[p.link] = 1; });

    function pegar(lista, quantos) {
      var fora = [];
      (lista || []).forEach(function (p) {
        if (fora.length >= quantos || jaVistos[p.link]) { return; }
        jaVistos[p.link] = 1;
        fora.push(p);
      });
      return fora;
    }

    var SETORES = {
      "achadinho.make":          ["Beleza", "Make que viraliza", "O que está em alta no TikTok, pelo menor preço"],
      "fatura.chora":            ["Tech", "Tech que vale cada real", "Fone, carregador e gadget com preço conferido"],
      "achadinhos.instantaneos": ["Casa", "Casa mais esperta", "O detalhe que resolve o dia a dia"],
      "cozinha.internacional":   ["Cozinha", "Cozinha da marmita", "Pote, balança e air fryer que fazem a semana render"],
      "atefalhar":               ["Geração 2000", "Da nossa época", "O que a geração 2000 ainda curte — pelo menor preço"],
      "varredura.carro":         ["Carro", "Pro seu carro", "Limpeza, luz e organização"],
      "varredura.jardim":        ["Jardim", "Jardim & varanda", "Planta viva e varanda bonita"],
      "varredura.ferramentas":   ["Ferramentas", "Faça você mesmo", "Ferramenta boa sem preço de loja"]
    };
    var ordem = (PRODUTOS_REAIS["_ordem"] || []).concat(
      Object.keys(SETORES).filter(function (k) {
        return (PRODUTOS_REAIS["_ordem"] || []).indexOf(k) < 0;
      })).filter(function (k) { return k !== atual && SETORES[k]; });
    var setores = [];
    ordem.forEach(function (k) {
      var itens = pegar(PRODUTOS_REAIS[k], 8);
      if (itens.length >= 2) setores.push([k, itens]);
    });
    var doTotal = [];      // o geral ja' esta' dentro dos setores
    var mistura = [];
    setores.forEach(function (st) {
      st[1].forEach(function (p) { mistura.push([st[0], p]); });
    });

    if (setores.length) {
      var nav = el("nav", "areas");
      nav.setAttribute("aria-label", "Categorias");
      outros.appendChild(nav);
      setores.forEach(function (st) {
        var info = SETORES[st[0]];
        var sec = el("section", "produtos setor");
        sec.id = "setor-" + info[0].toLowerCase();
        var cab = el("div", "cabeca");
        cab.appendChild(el("h2", null, info[1]));
        cab.appendChild(el("p", "apoio", info[2]));
        sec.appendChild(cab);
        var g = el("div", "vitrine trilho-setor");
        st[1].forEach(function (p) { g.appendChild(montarProduto(p)); });
        sec.appendChild(g);
        outros.appendChild(sec);
        var b = el("button", "area", info[0]);
        b.type = "button";
        b.addEventListener("click", function () {
          sec.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        nav.appendChild(b);
      });
    }

    var naTela = document.querySelectorAll(
      "#vitrine .produto, #outros .produto").length;
    var rolar = document.getElementById("rolar");
    var prova = document.getElementById("prova");
    if (naTela > 0) {
      document.getElementById("rolar_texto").textContent =
        "ver os " + naTela + " de hoje ";
      rolar.hidden = false;
      var quando = (lista_do_canal[0] || doTotal[0] || {}).visto || "";
      prova.textContent = naTela + " achadinhos" +
        (quando ? " · preços conferidos em " + quando : "") +
        " · link direto pra loja";
    } else {
      rolar.hidden = true;
      prova.textContent = "";
    }

    animarVitrine(usaNicho ? nicho : lista_do_canal.concat(
      mistura.map(function (m) { return m[1]; })));

    Array.prototype.forEach.call(document.querySelectorAll(".aba"), function (a) {
      a.setAttribute("aria-pressed", String(a.dataset.canal === chave));
    });

  }

  var abas = document.getElementById("abas");
  abas && Object.keys(CANAIS).forEach(function (chave) {
    var b = el("button", "aba", CANAIS[chave].nome);
    b.type = "button";
    b.dataset.canal = chave;
    b.addEventListener("click", function () { atual = chave; desenhar(atual); });
    abas.appendChild(b);
  });

  document.getElementById("interruptor").addEventListener("click", function () {
    mostrandoProdutos = !mostrandoProdutos;
    desenhar(atual);
  });

  var PORTAS = {
    "oachadinho": "c1", "make": "c1",        // Achadinho Make
    "meulivro": "c2", "livro": "c2", "livros": "c2",         // Sem Anestesia
    "modofuturo": "c4", "futuro": "c4",      // Modo Futuro (27/09/2026)
    "achadinhochef": "c5", "chef": "c5",
    "pagomenos": "c6",                       // Fatura Chora
    "achadinhodehoje": "c7", "hoje": "c7",
    "atefalhar": "c3", "2000": "c3"          // Geracao 2000 (28/09/2026)
  };
  var doHost = PORTAS[location.hostname.split(".")[0]];

  var doCaminho = (location.pathname.match(/\/(c[1-9])\/?$/) || [])[1];
  if (/\/dodia\/?$/.test(location.pathname)) doCaminho = "c8";
  var pedido = doHost || doCaminho ||
              new URLSearchParams(location.search).get("c");
  if (pedido) {
    var achado = Object.keys(CANAIS).filter(function (k) {
      return CANAIS[k].banco === pedido || k === pedido;
    })[0];
    if (achado) atual = achado;
  }

  desenhar(atual);

  medir("visita", { canal: CANAIS[atual].banco });
})();
</script>
</html>
